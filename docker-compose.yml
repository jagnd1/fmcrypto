services:
  crypto:
    build:
      context: ./services
      dockerfile: crypto_svc/Dockerfile
    environment:
      PORT: ${PORT:-8001}
      GRPC_PORT: ${GRPC_PORT:-50051}
      APP_ENV: ${APP_ENV:-development}
      # HSM provider: GP (software) / PS / AT (real HSMs)
      CRYPTO_HSM: ${CRYPTO_HSM:-GP}
      # Explicit local-only overrides. Disable them in deployments.
      ALLOW_INSECURE_AUTH: ${ALLOW_INSECURE_AUTH:-true}
      GRPC_REFLECTION: ${GRPC_REFLECTION:-true}
      ENABLE_INTERNAL_UNWRAP: ${ENABLE_INTERNAL_UNWRAP:-false}
      # Headless service-to-service auth via API keys.
      API_KEY_PREFIX: ${API_KEY_PREFIX:-crypto_}
      API_KEYS: ${API_KEYS:-}
      API_KEY_ROLES: ${API_KEY_ROLES:-admin}
    ports:
      - "${PORT:-8001}:8001"
      - "${GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
