name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: services/crypto_svc/go.sum
      - name: Install pinned tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
      - name: Verify common
        working-directory: services/common
        run: |
          test -z "$(gofmt -l .)"
          go test -race -count=1 ./...
          go vet ./...
          govulncheck ./...
      - name: Verify crypto service
        working-directory: services/crypto_svc
        run: make proto-check test-race lint standalone
      - name: Build container
        run: docker build -f services/crypto_svc/Dockerfile -t fmcrypto:${{ github.sha }} services

  container-scan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -f services/crypto_svc/Dockerfile -t fmcrypto:scan services
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fmcrypto:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan result
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
